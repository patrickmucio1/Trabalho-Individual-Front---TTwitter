<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Página de cadastro da plataforma TTwitter."
    />
    <meta name="author" content="Patrick Mucio" />
    <title>Cadastro | TTwitter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="auth-page register-page">
      <section class="auth-card register-card">
        <header class="auth-header">
          <h1>Cadastro</h1>
        </header>

        <form class="auth-form" action="./index.html">
          <div class="field">
            <label for="name">Nome</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="nome de usuário"
              autocomplete="name"
              required
            />
          </div>

          <div class="field">
            <label for="register-email">Email</label>
            <input
              type="email"
              id="register-email"
              name="email"
              placeholder="example@email.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="field">
            <label for="birth-date">Data de nascimento</label>
            <input
              type="text"
              id="birth-date"
              name="birth-date"
              placeholder="xx/xx/xxxx"
              inputmode="numeric"
              required
            />
          </div>

          <div class="field">
            <label for="register-password">Senha</label>

            <div class="password-field">
              <input
                type="password"
                id="register-password"
                name="password"
                placeholder="•••••••••"
                autocomplete="new-password"
                required
              />

              <img
                class="eye-icon"
                src="./assets/eye.png"
                alt=""
                aria-hidden="true"
              />
            </div>
          </div>

          <div class="field">
            <label for="confirm-password">Confirmar senha</label>

            <div class="password-field">
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="•••••••••"
                autocomplete="new-password"
                required
              />

              <img
                class="eye-icon"
                src="./assets/eye.png"
                alt=""
                aria-hidden="true"
              />
            </div>
          </div>

          <div class="terms-checkbox">
            <input
              type="checkbox"
              id="accept-terms"
              name="accept-terms"
              required
            />

            <label for="accept-terms">
              Li e estou de acordo com os
              <a href="#">Termos</a> e
              <a href="#">Condições de uso</a>.
            </label>
          </div>

          <button class="primary-button" type="submit">Cadastrar</button>
        </form>

        <a class="auth-main-link" href="./index.html">Fazer Login</a>
      </section>

      <section class="auth-logo-area" aria-label="Identidade visual do TTwitter">
        <img
          class="auth-logo"
          src="./assets/logo.png"
          alt="Logotipo do TTwitter"
        />
      </section>
    </main>
  </body>
</html>
